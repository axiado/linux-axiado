%YAML 1.2
---
$id: http://devicetree.org/schemas/display/axiado/axiado,display-subsystem.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Axiado DRM

maintainers:
  - Shubhangini <shubhangini@axiado.com>
  - Prasad Bolisetty <pbolisetty@axiado.com>

description: |
    Minimal binding for Axiado SoC display subsystem container node that ties
    together display pipeline blocks.

properties:

  compatible:
    const: axiado,display-subsystem

  ports:
    $ref: /schemas/types.yaml#/definitions/phandle-array
    description:
      List of phandles to the output port nodes of the display pipeline
      blocks tied together by this subsystem.

required:
  - compatible
  - ports

additionalProperties: false

examples:
  - |
    display-subsystem {
        compatible = "axiado,display-subsystem";
        ports = <&disp_out>;
    };
...
