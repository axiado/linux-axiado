%YAML 1.2
---
$id: http://devicetree.org/schemas/gpio/axiado,sgpio.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Axiado SGPIO Controller

maintainers:
  - Tzu-Hao Wei <twei@axiado.com>
  - Swark Yang <syang@axiado.com>
  - Prasad Bolisetty <pbolisetty@axiado.com>

description: |
  Axiado Serial GPIO (SGPIO) controller provides GPIO expansion using
  serial shift registers. The controller acts as both a GPIO controller
  and an interrupt controller.

properties:
  compatible:
    const: axiado,sgpio

  reg:
    maxItems: 1

  gpio-controller: true

  "#gpio-cells":
    const: 2

  interrupt-controller: true

  "#interrupt-cells":
    const: 2

  interrupts:
    maxItems: 1

  clocks:
    maxItems: 1

  ngpios:
    description:
      Number of GPIOs supported by the controller.
    $ref: /schemas/types.yaml#/definitions/uint32

  bus-frequency:
    description:
      SGPIO shift clock frequency in Hz.
    $ref: /schemas/types.yaml#/definitions/uint32

  apb-frequency:
    description:
      APB bus frequency in Hz.
    $ref: /schemas/types.yaml#/definitions/uint32

  dout-init:
    description:
      Initial output values for the four DOUT registers.
    $ref: /schemas/types.yaml#/definitions/uint32-array
    minItems: 4
    maxItems: 4

  design-variant:
    description:
      Hardware design variant (for example, 128 or 512).
    $ref: /schemas/types.yaml#/definitions/uint32
    enum: [128, 512]

required:
  - compatible
  - reg
  - gpio-controller
  - "#gpio-cells"
  - interrupt-controller
  - "#interrupt-cells"
  - interrupts
  - clocks
  - ngpios
  - bus-frequency
  - apb-frequency
  - dout-init

additionalProperties: false

examples:
  - |
    #include <dt-bindings/interrupt-controller/arm-gic.h>
    #include <dt-bindings/interrupt-controller/irq.h>

    soc {
        #address-cells = <2>;
        #size-cells = <2>;

        sgpio0: sgpio@33201c00 {
            compatible = "axiado,sgpio";
            reg = <0x0 0x33201c00 0x0 0x400>;
            gpio-controller;
            #gpio-cells = <2>;
            interrupt-parent = <&gic500>;
            interrupt-controller;
            #interrupt-cells = <2>;
            interrupts = <GIC_SPI 125 IRQ_TYPE_LEVEL_HIGH>;
            clocks = <&sysclk>;
            design-variant = <512>;
            ngpios = <128>;
            bus-frequency = <12000000>;
            apb-frequency = <100000000>;
            dout-init = <0x00000000 0x00000000
                         0x00000000 0x00000000>;
            status = "disabled";
        };
    };
