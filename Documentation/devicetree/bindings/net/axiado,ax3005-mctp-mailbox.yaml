%YAML 1.2
---
$id: http://devicetree.org/schemas/net/axiado,ax3005-mctp-mailbox.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Axiado MCTP over Shared Memory + Mailbox Transport

maintainers:
  - Akhila Kavi <akavi@axiado.com>
  - Sammai Chakravarthy <schakravarthy@axiado.com>
  - Prasad Bolisetty <pbolisetty@axiado.com>

description:
  MCTP transport for the Axiado AX3005 SoC. MCTP packets are carried in two
  reserved shared-memory windows (one per direction) referenced by
  memory-region phandles. A pair of mailbox channels is used purely as
  doorbells and acknowledgements - a "tx" channel (Processor to Co-Processor) and an "rx"
  channel (Co-Processor to Processor). The MTU is derived from the TX shared-memory window
  size, which is required to be at least the DMTF DSP0236 section 8.3 minimum
  MCTP MTU of 68 bytes.

properties:
  compatible:
    const: axiado,ax3005-mctp-mailbox

  memory-region:
    items:
      - description: TX shared memory (Processor writes, Co-Processor reads)
      - description: RX shared memory (Co-Processor writes, Processor reads)

  mboxes:
    items:
      - description: TX doorbell channel (Processor to Co-Processor)
      - description: RX doorbell channel (Co-Processor to Processor)

  mbox-names:
    items:
      - const: tx
      - const: rx

required:
  - compatible
  - memory-region
  - mboxes
  - mbox-names

additionalProperties: false

examples:
  - |
    mctp {
        compatible = "axiado,ax3005-mctp-mailbox";
        memory-region = <&shm_ap_to_rot>, <&shm_rot_to_ap>;
        mboxes = <&mailbox0 0>, <&mailbox0 8>;
        mbox-names = "tx", "rx";
    };
