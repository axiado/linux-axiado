%YAML 1.2
---

$id: http://devicetree.org/schemas/soc/axiado/axiado,ax3000-espi.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Axiado eSPI Controller Driver

maintainers:
  - Satya Jena <sjena@axiado.com>
  - Rajan Patel <rpatel@axiado.com>
  - Prasad Bolisetty <pbolisetty@axiado.com>

description: |
  The Axiado eSPI controller provides connectivity between a host
  system and embedded peripheral devices. The controller handles eSPI
  protocol communication and provides interrupt management for child
  peripheral devices.

  The controller is a top-level SoC peripheral accessed directly via
  MMIO on a 64-bit address bus, and uses ranges to map child addresses
  into the SoC address space.

properties:
  compatible:
    const: axiado,ax3000-espi

  reg:
    minItems: 3
    maxItems: 6

  reg-names:
    items:
      - const: espi-core
      - const: espi-perif
      - const: espi-atu

  interrupts:
    items:
      - description: eSPI IP core interrupt
      - description: External ATU interrupt for peripherals

  interrupt-names:
    items:
      - const: espi-core-intr
      - const: ext-atu-intr

  interrupt-controller: true

  "#interrupt-cells":
    const: 1
    description: |
      Interrupt specifier for child devices. The single cell contains the
      virtual interrupt number corresponding to bits in the external ATU
      ISR register.

  "#address-cells":
    const: 1

  "#size-cells":
    const: 1

  ranges: true

  axiado,fifo-flush-timeout-ms:
    minimum: 1
    maximum: 1000
    default: 100
    description:
      Timeout in milliseconds for FIFO flush operations.

  axiado,poll-delay-min-us:
    minimum: 1
    maximum: 100
    default: 10
    description:
      Minimum polling interval in microseconds between register reads.

  axiado,poll-delay-max-us:
    minimum: 1
    maximum: 100
    default: 20
    description:
      Maximum polling interval in microseconds between register reads.

patternProperties:
  "^[a-z][a-z0-9-]*@[0-9a-f]+$":
    type: object
    description: Child eSPI peripheral devices.

required:
  - compatible
  - reg
  - reg-names
  - interrupts
  - interrupt-names
  - interrupt-controller
  - "#interrupt-cells"
  - "#address-cells"
  - "#size-cells"
  - ranges

unevaluatedProperties: false

examples:
  - |
    #include <dt-bindings/interrupt-controller/irq.h>

    espi@330d0000 {
        compatible = "axiado,ax3000-espi";
        reg = <0x0 0x330d0000 0x0 0x1000>,
              <0x0 0x330d1000 0x0 0x1000>,
              <0x0 0x330d2000 0x0 0x1000>;
        reg-names = "espi-core", "espi-perif", "espi-atu";

        interrupt-parent = <&gic500>;
        interrupts = <0 266 IRQ_TYPE_LEVEL_HIGH>,
                     <0 134 IRQ_TYPE_LEVEL_HIGH>;
        interrupt-names = "espi-core-intr", "ext-atu-intr";
        interrupt-controller;
        #interrupt-cells = <1>;
        #address-cells = <1>;
        #size-cells = <1>;

        ranges = <0x0 0x330d0000 0x3000>;
    };
