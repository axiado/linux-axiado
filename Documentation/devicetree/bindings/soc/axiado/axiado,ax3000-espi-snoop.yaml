%YAML 1.2
---
$id: http://devicetree.org/schemas/soc/axiado/axiado,ax3000-espi-snoop.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Axiado eSPI Snoop Driver

maintainers:
  - Rajan Patel <rpatel@axiado.com>
  - Satya Jena <sjena@axiado.com>
  - Prasad Bolisetty <pbolisetty@axiado.com>

description: |
  The eSPI Snoop device captures Port80 POST codes transmitted by
  the host over the eSPI bus. The snoop block is exposed as a
  memory-mapped peripheral of the parent eSPI controller, and
  registers are accessed directly through the SoC address space.

properties:
  compatible:
    const: axiado,ax3000-espi-snoop

  reg:
    maxItems: 1
    description:
      MMIO base address and register range size of the snoop block,
      directly addressable in the SoC memory map.

  interrupts:
    maxItems: 1
    description:
      Virtual interrupt identifier supplied by the parent eSPI
      controller. This corresponds to the interrupt bit position used
      by the parent controller's interrupt controller and is not a
      hardware GIC interrupt number. The associated interrupt-parent
      (see common interrupts binding) is normally inherited from this
      node's parent eSPI controller in the device tree hierarchy.

  io-addr:
    $ref: /schemas/types.yaml#/definitions/uint32
    description:
      Host I/O port address monitored by the snoop device. This is
      typically the Port80 POST code address used by the host firmware.

  addr-size:
    $ref: /schemas/types.yaml#/definitions/uint32
    minimum: 1
    description:
      Optional property that value specifies how many consecutive bytes are
      valid starting from the base address defined in the reg property.
      If not provided, the driver defaults to 4 bytes (0x80–0x83),
      corresponding to a 32-bit PostCode register.

required:
  - compatible
  - reg
  - interrupts
  - io-addr

additionalProperties: false

examples:
  - |
    espi@330d0000 {
        compatible = "axiado,ax3000-espi";
        reg = <0x330d0000 0x1000>;
        interrupt-parent = <&gic500>;
        interrupts = <0 266 4>, <0 134 4>;
        interrupt-names = "espi-core-intr", "ext-atu-intr";
        interrupt-controller;
        #interrupt-cells = <1>;
        #address-cells = <1>;
        #size-cells = <1>;
        ranges = <0x0 0x330d0000 0x3000>;

        espi-snoop@330d10c0 {
            compatible = "axiado,ax3000-espi-snoop";
            reg = <0x330d10c0 0x10>;
            interrupts = <13>;
            io-addr = <0x80>;
            addr-size = <4>;
        };
    };

